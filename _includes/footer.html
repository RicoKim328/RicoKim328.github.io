<footer class="site-footer">

      <li><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>

      <li><a href="{{ '/feed.xml' | relative_url }}">RSS Feed</a></li>

      <p>Copyright © {{ 'now' | date: "%Y" }} {{ site.name }}. All rights reserved.</p>
    </div>
  </div>
